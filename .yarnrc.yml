# approvedGitRepositories, enableScripts and npmMinimalAgeGate were written by Yarn's own migration (4.7 → 4.18)
# to keep the pre-4.18 defaults. Install scripts must stay on: better-sqlite3's fetches its prebuilt binary (or
# builds it with node-gyp when none matches).
approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0
