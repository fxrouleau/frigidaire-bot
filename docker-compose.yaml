services:
  # Local/prod-style run of the bot image. Every setting comes from .env (see AGENTS.md for the list);
  # the Portainer stack in production sets the same variables in its own environment block.
  frigidaire-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        GIT_SHA: "${GIT_SHA:-}"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    volumes:
      - ./data:/app/data

  test:
    profiles: [dev]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    user: node
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - RUN_LIVE=${RUN_LIVE:-}
      - DEBUG_CAPTURE=${DEBUG_CAPTURE:-}
