name: PR checks

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - name: Run lint, typecheck, build, and tests in container
      uses: docker/build-push-action@v6
      with:
        context: .
        target: ci
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Semgrep
      uses: semgrep/semgrep-action@v1
      with:
        config: .semgrep/

    - name: Build prod image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # The code-execution sidecar (sandbox/): build it and run the smoke test against a container started with the same
  # hardening as docker-compose.yaml. Its own cache scope keeps it from evicting the bot image's layers.
  sandbox:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - name: Build sandbox image
      uses: docker/build-push-action@v6
      with:
        context: sandbox
        load: true
        tags: frigidaire-sandbox:ci
        cache-from: type=gha,scope=sandbox
        cache-to: type=gha,mode=max,scope=sandbox

    - name: Smoke-test the sandbox
      run: sh sandbox/ci-smoke.sh frigidaire-sandbox:ci
