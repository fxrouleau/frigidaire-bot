name: Docker Build CI

on:
  pull_request:
    branches: [ master ]

# Least-privilege GITHUB_TOKEN. gitleaks-action needs pull-requests access: it
# fetches PR commits/comments via the API (read; a 403 crashes the step) and
# posts a review comment when it finds a leak (write; failures only warn).
permissions:
  contents: read
  pull-requests: write

# One run per PR ref; a new push supersedes the in-flight run.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - name: Run lint, typecheck, build, and tests in container
      uses: docker/build-push-action@v6
      with:
        context: .
        target: ci
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Semgrep
      uses: semgrep/semgrep-action@v1
      with:
        config: .semgrep/

    - name: Build prod image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
