name: PR checks

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: docker/setup-buildx-action@v4

    - name: Run lint, typecheck, build, and tests in container
      uses: docker/build-push-action@v7
      with:
        context: .
        target: ci
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Gitleaks
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # The repo's own rules (.semgrep/), any finding fails the job. semgrep/semgrep-action is deprecated upstream; this is
    # Semgrep's documented replacement (its official image running `semgrep scan`), kept as a step so it still gates
    # the prod image build below.
    - name: Semgrep
      run: docker run --rm -v "${{ github.workspace }}:/src" -w /src semgrep/semgrep semgrep scan --config .semgrep/ --error

    - name: Build prod image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # The code-execution sidecar (sandbox/): build it and run the smoke test against a container started with the same
  # hardening as docker-compose.yaml. Its own cache scope keeps it from evicting the bot image's layers.
  sandbox:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: docker/setup-buildx-action@v4

    - name: Build sandbox image
      uses: docker/build-push-action@v7
      with:
        context: sandbox
        load: true
        tags: frigidaire-sandbox:ci
        cache-from: type=gha,scope=sandbox
        cache-to: type=gha,mode=max,scope=sandbox

    - name: Smoke-test the sandbox
      run: sh sandbox/ci-smoke.sh frigidaire-sandbox:ci
