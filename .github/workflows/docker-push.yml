name: Build and push prod image

on:
  workflow_dispatch:
  push:
    paths:
        - 'Dockerfile'
        - 'docker/**'
        - 'docker-compose.yaml'
        - '.github/workflows/**'
        - 'package.json'
        - 'yarn.lock'
        - '.dockerignore'
        - 'src/**'
        - 'tsconfig.json'
        - 'tsconfig.test.json'
        - 'vitest.config.ts'
        - 'biome.json'
        - 'sandbox/**'
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: docker-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Run lint, typecheck, build, and tests in container
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate tags
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE_TAG=$(date +%Y%m%d)
          echo "date_tag=${DATE_TAG}" >> $GITHUB_OUTPUT
          echo "sha_tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_USERNAME }}/frigidaire-bot
          tags: |
            type=raw,value=${{ steps.tags.outputs.date_tag }}
            type=raw,value=sha-${{ steps.tags.outputs.sha_tag }}
            type=raw,value=latest

      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The code-execution sidecar image. Rebuilt only when sandbox/ changed (or on a manual run): a new digest makes
  # watchtower restart the sidecar, so an unchanged sandbox must not be re-pushed on every bot deploy.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did sandbox/ change?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "sandbox=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$AFTER" -- sandbox/; then
            echo "sandbox=false" >> "$GITHUB_OUTPUT"
          else
            echo "sandbox=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.changed.outputs.sandbox == 'true'

      - name: Build sandbox image
        if: steps.changed.outputs.sandbox == 'true'
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          load: true
          tags: frigidaire-sandbox:ci
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox

      - name: Smoke-test the sandbox
        if: steps.changed.outputs.sandbox == 'true'
        run: sh sandbox/ci-smoke.sh frigidaire-sandbox:ci

      - name: Generate tags
        if: steps.changed.outputs.sandbox == 'true'
        id: tags
        run: |
          echo "date_tag=$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "sha_tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: DockerHub Login
        if: steps.changed.outputs.sandbox == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push sandbox image
        if: steps.changed.outputs.sandbox == 'true'
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/frigidaire-sandbox:latest
            ${{ vars.DOCKER_USERNAME }}/frigidaire-sandbox:${{ steps.tags.outputs.date_tag }}
            ${{ vars.DOCKER_USERNAME }}/frigidaire-sandbox:sha-${{ steps.tags.outputs.sha_tag }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
